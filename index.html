<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Abhishek — Portfolio</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=Syne:wght@700;800;900&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Navigation (Hidden initially, slides in during intro) -->
  <header class="navbar intro-hidden" id="mainNavbar">
    <a href="#home" class="logo">ABHISHEK</a>
    <nav class="nav-links">
      <a href="#home" class="nav-link active">HOME</a>
      <a href="#about" class="nav-link">ABOUT</a>
      <a href="#service" class="nav-link">SERVICE</a>
      <a href="#project" class="nav-link">PROJECT</a>
      <a href="#components" class="nav-link">COMPONENTS</a>
      <a href="#contact" class="nav-link">CONTACT</a>
    </nav>
  </header>

  <!-- Hero Section -->
  <main class="hero-section" id="home">
    <!-- Particle Canvas in Pure Black Background -->
    <canvas id="particleCanvas"></canvas>

    <!-- Overlay Titles & Badges -->
    <div class="hero-foreground">
      <!-- Animated Title (Starts Center Screen for Intro, Slides to Bottom) -->
      <div class="hero-center intro-center" id="heroCenter">
        <h1 class="giant-portfolio-text" id="giantTitle">
          <span class="anim-letter-group slide-left" id="prefixText"></span>
          <span class="i-letter-wrap" id="iLetterWrap">
            <span class="i-bar" id="iBar"></span>
            <span class="i-dot" id="iDot"></span>
            <span class="i-floor-shadow" id="iFloorShadow"></span>
          </span>
          <span class="anim-letter-group slide-right" id="suffixText"></span>
        </h1>
      </div>

      <!-- Bottom Info Bar (Fades in during intro) -->
      <div class="hero-footer-bar intro-hidden" id="heroFooter">
        <div class="hero-role-wrapper">
          <span class="role-bold">Full Stack</span>
          <span class="role-italic">Developer</span>
        </div>
      </div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
